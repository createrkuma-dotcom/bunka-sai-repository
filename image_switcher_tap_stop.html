<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>画像切り替え</title>
<style>
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
#image{
  width:100vw;height:100vh;object-fit:contain;display:block;background:#000;
}
body.stopped #image{visibility:hidden}
</style>
</head>
<body>
<img id="image" alt="">
<script>
// ===== 設定：ここだけ変更 =====
const images = ["image1.jpg", "image2.jpg"];
const intervalSeconds = 4;
// =============================

const image = document.getElementById("image");
let current = 0;
let timer = null;
let stopped = false;

function startFromBeginning(){
  clearInterval(timer);
  stopped = false;
  document.body.classList.remove("stopped");

  current = 0;
  image.src = images[current];

  timer = setInterval(() => {
    current = (current + 1) % images.length;
    image.src = images[current];
  }, intervalSeconds * 1000);
}

function stopAndBlackout(){
  clearInterval(timer);
  timer = null;
  stopped = true;
  document.body.classList.add("stopped");
}

function toggle(){
  if(stopped){
    startFromBeginning();
  }else{
    stopAndBlackout();
  }
}

// iPad / iPhone / PC のタップ・クリック
document.addEventListener("pointerup", toggle);

// PCキーボードの S キー
document.addEventListener("keydown", (event) => {
  if(event.key.toLowerCase() === "s" && !event.repeat){
    toggle();
  }
});

startFromBeginning();
</script>
</body>
</html>
